# Categories of GitHub's generated release notes, by pull-request label (the
# labels .github/labels.json defines). The Release workflow does not use them:
# it writes every release's title and notes from CHANGELOG.md
# (docs/changelog-design.md). They apply when notes are generated by hand,
# with "Generate release notes" on a release page or `gh release create
# --generate-notes`. Dependabot's pin updates are left out.
changelog:
  exclude:
    labels:
      - dependencies
  categories:
    - title: Fixed
      labels:
        - bug
    - title: New and changed
      labels:
        - enhancement
    - title: Security
      labels:
        - security
    - title: Documentation
      labels:
        - documentation
    - title: Tooling and CI
      labels:
        - ci
        - release
    - title: Other changes
      labels:
        - "*"
